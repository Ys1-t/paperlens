name: ios-app

# 手动触发：在 GitHub → Actions → ios-app → Run workflow。
# 产物是未签名 IPA（PaperLens-unsigned-ipa），Windows 上用 Sideloadly/AltStore
# + Apple ID 侧载进 iPhone/iPad。见 mobile/README.md。
on:
  workflow_dispatch:

jobs:
  build-unsigned-ipa:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Capacitor deps
        working-directory: mobile
        run: npm install

      - name: Assemble web root (app/ + shared libs)
        working-directory: mobile
        run: npm run build:www

      - name: Add iOS platform
        working-directory: mobile
        run: npx cap add ios

      - name: Sync web assets into iOS project
        working-directory: mobile
        run: npx cap sync ios

      - name: Build unsigned archive
        working-directory: mobile/ios/App
        run: |
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/App.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        working-directory: mobile/ios/App
        run: |
          mkdir -p build/Payload
          cp -R "build/App.xcarchive/Products/Applications/App.app" build/Payload/
          cd build
          zip -qry PaperLens-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: PaperLens-unsigned-ipa
          path: mobile/ios/App/build/PaperLens-unsigned.ipa
          retention-days: 14
